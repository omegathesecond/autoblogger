name: Deploy to Cloud Run
on:
  push:
    branches: [main, master]
env:
  PROJECT_ID: omevision-utils
  REGION: europe-west1
  SERVICE: autoblogger
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build
        run: |
          npm ci
          npx prisma generate
          npm run build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build & Deploy
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker build -t gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }} .
          docker push gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }}
          gcloud run deploy $SERVICE \
            --image gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }} \
            --region $REGION --platform managed --allow-unauthenticated \
            --project $PROJECT_ID \
            --set-secrets 'DATABASE_URL=AUTOBLOGGER_DB_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,INTERNAL_API_KEY=OMEVISION_INTERNAL_KEY:latest,JOB_SECRET=OMEVISION_JOB_SECRET:latest,ENEZA_BLOG_API_KEY=OMEVISION_ENEZA_BLOG_KEY:latest'
