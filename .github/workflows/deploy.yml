name: Deploy to Cloud Run

on:
  push:
    branches: [master, main]

env:
  PROJECT_ID: omevision-utils
  REGION: europe-west1
  SERVICE: autoblogger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push Image
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker build -t gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }} .
          docker push gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --project $PROJECT_ID \
            --set-secrets 'DATABASE_URL=AUTOBLOGGER_DB_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,INTERNAL_API_KEY=OMEVISION_INTERNAL_KEY:latest,JOB_SECRET=OMEVISION_JOB_SECRET:latest,ENEZA_BLOG_API_KEY=OMEVISION_ENEZA_BLOG_KEY:latest' \
            --set-env-vars 'NODE_ENV=production'
