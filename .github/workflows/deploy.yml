# Deploys are now driven by Cloud Build on the hiyebo project
# (trigger: `autoblogger-api-prod`, runs `cloudbuild.yaml` on push to main).
# This GitHub Actions workflow is intentionally a no-op so it doesn't fight
# with Cloud Build or try to deploy to the legacy omevision-utils project.
#
# To verify the active deploy path:
#   gcloud builds triggers describe autoblogger-api-prod --project=hiyebo
#
# History: this file used to deploy a separate Cloud Run service called
# `autoblogger` in `omevision-utils`. That deploy target is deprecated;
# the canonical service is `autoblogger-api-prod` in `hiyebo`. See
# project_gcp_project_layout_apr23 in MEMORY.md.

name: noop (deploys handled by Cloud Build on hiyebo)

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Document active deploy path
        run: |
          echo "Deploys for this repo run on Cloud Build (hiyebo project)."
          echo "Trigger: autoblogger-api-prod (push to main → cloudbuild.yaml)"
          echo "This workflow exists only to document that fact."
