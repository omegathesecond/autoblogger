name: Retired domain release guard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the shared release guard and active release inputs
        working-directory: .
        run: |
          mkdir -p .release-tools
          tar -xzf vendor/omevision-release-guard-1.0.0.tgz -C .release-tools
          node --test .release-tools/package/test/guard.test.mjs
          node .release-tools/package/cli.mjs --phase source
          node .release-tools/package/test/release-wiring.mjs
