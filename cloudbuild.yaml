substitutions:
  _ENV: prod              # default — overridden by dev trigger to "dev"
  _SERVICE: autoblogger-api
  _REGION: europe-west1

steps:
  # 1. Build
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}-${_ENV}:$COMMIT_SHA
      - .

  # 2. Push to GCR
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE}-${_ENV}:$COMMIT_SHA

  # 3. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}-${_ENV}
      - --image
      - gcr.io/$PROJECT_ID/${_SERVICE}-${_ENV}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '8080'
      - --set-env-vars
      - NODE_ENV=${_ENV},ENEZA_BLOG_URL=https://eneza-api-prod-1026777738823.europe-west1.run.app/api/blog/posts,ENEZA_BLOG_API_KEY=UmWIw5ajH7/MgRNKczZFDZ2T7wIPSAyQJVx7YAqWf8k=,VAVU_BLOG_URL=https://vavu-api-41980725786.europe-west1.run.app/api/blog/posts,BAMZU_BLOG_URL=https://bamzu-api-25158090642.europe-west1.run.app/api/blog/posts,YEBONA_BLOG_URL=https://yebona-api-402346709223.europe-west1.run.app/api/blog/posts,YEBOJOBS_BLOG_URL=https://yebojobs-api-376380527123.europe-west1.run.app/api/blog/posts,YEBOLINK_BLOG_URL=https://yebolink-api-487987213774.europe-west1.run.app/api/blog/posts
      - --set-secrets
      - DATABASE_URL=AUTOBLOGGER__DB_URL:latest,GEMINI_API_KEY=AUTOBLOGGER__GEMINI_API_KEY:latest,INTERNAL_API_KEY=AUTOBLOGGER__OMEVISION_INTERNAL_KEY:latest,JOB_SECRET=AUTOBLOGGER__OMEVISION_JOB_SECRET:latest,VAVU_BLOG_API_KEY=AUTOBLOGGER__VAVU_BLOG_API_KEY:latest,BAMZU_BLOG_API_KEY=AUTOBLOGGER__BAMZU_BLOG_API_KEY:latest,YEBONA_BLOG_API_KEY=AUTOBLOGGER__YEBONA_BLOG_API_KEY:latest,YEBOLINK_BLOG_API_KEY=AUTOBLOGGER__YEBOLINK_BLOG_API_KEY:latest,YEBOJOBS_BLOG_API_KEY=AUTOBLOGGER__YEBOJOBS_BLOG_API_KEY:latest,YEBOLEARN_BLOG_API_KEY=AUTOBLOGGER__YEBOLEARN_BLOG_API_KEY:latest

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}-${_ENV}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
